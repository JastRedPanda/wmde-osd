[package]
name = "wmde-osd"
version = "1.10.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
futures = "0.3.32"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-comp-config = { git = "https://github.com/pop-os/cosmic-comp" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "dbus-config",
    "desktop-systemd-scope",
    "tokio",
    "wayland",
    "multi-window",
    "winit",
    "single-instance",
] }
log = "0.4.29"
logind-zbus = "5.3.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["process", "macros"] }
tokio-stream = "0.1.18"
uzers = "0.12.2"
xdg = "3.0"
zbus = { version = "5.14", default-features = false, features = ["tokio"] }
kdl = "6"
cosmic-randr-shell = { git = "https://github.com/pop-os/cosmic-randr", default-features = false }
xkb-data = "0.2.2"

[dependencies.cosmic-settings-airplane-mode-subscription]
git = "https://github.com/pop-os/cosmic-settings"

[dependencies.cosmic-settings-audio-client]
git = "https://github.com/pop-os/cosmic-settings-daemon"
features = ["codec"]

[dependencies.cosmic-settings-upower-subscription]
git = "https://github.com/pop-os/cosmic-settings"

[dependencies.cosmic-settings-daemon-subscription]
git = "https://github.com/pop-os/cosmic-settings"

# WMDE forks (local sibling paths). libcosmic carries the wmde config-root +
# fun.wmde.* theme/toolkit ids; the sibling forks carry the renamed cross-component
# config ids consumed here (audio varlink client, comp config, settings subscriptions).
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

[patch."https://github.com/pop-os/cosmic-comp"]
cosmic-comp-config = { path = "../wmde-comp/cosmic-comp-config" }

[patch."https://github.com/pop-os/cosmic-settings-daemon"]
cosmic-settings-audio-client = { path = "../wmde-settings-daemon/audio-client" }

[patch."https://github.com/pop-os/cosmic-settings"]
cosmic-settings-airplane-mode-subscription = { path = "../wmde-settings/subscriptions/airplane-mode" }
cosmic-settings-upower-subscription = { path = "../wmde-settings/subscriptions/upower" }
cosmic-settings-daemon-subscription = { path = "../wmde-settings/subscriptions/settings-daemon" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
lto = "fat"
opt-level = 3
panic = "abort"

# WMDE: redirect the last upstream pop-os/cosmic-randr git dep to the local wmde-randr
# fork (crate names kept - only the CLI binary is renamed). Both URL forms because the
# consumers declare the dep with and without a trailing slash; the shell crate pulls the
# lib crate transitively from the same git source, so both are patched.
codegen-units = 1
[patch."https://github.com/pop-os/cosmic-randr"]
cosmic-randr-shell = { path = "../wmde-randr/shell" }

[patch."https://github.com/pop-os/dbus-settings-bindings"]
upower_dbus = { path = "../wmde-dbus-settings-bindings/upower" }
